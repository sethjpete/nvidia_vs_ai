[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvai"
version = "0.1.0"
description = "NVIDIA hedge ratios against baskets of AI stocks and ETFs, with borrow-adjusted total returns"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "yfinance>=0.2.40",
  "wrds>=3.2",
  "python-dotenv>=1.0",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "requests>=2.31",
  "jupyterlab>=4",
  "jupytext>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"research/*" = ["B018", "E402"]   # notebook cells end with a bare expression to display it
